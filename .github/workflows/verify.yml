name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ghostscript \
            latexmk \
            lmodern \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-extra
      - name: Verify finite mathematics
        run: make verify-math
      - name: Verify release
        run: python3 verification/verify_release.py --compile --portable
      - name: Verify square-endpoint packet
        run: make verify-square-endpoint
