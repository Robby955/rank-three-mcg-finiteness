name: Lean normalizer core

on:
  push:
    paths:
      - 'lean/normalizer-core/**'
      - '.github/workflows/lean-normalizer.yml'
  pull_request:
    paths:
      - 'lean/normalizer-core/**'
      - '.github/workflows/lean-normalizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lean/normalizer-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check distributed source hashes
        run: sha256sum -c SHA256SUMS
      # Inputs are documented in leanprover/lean-action's action.yml.
      - name: Install pinned Lean and fetch mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: lean/normalizer-core
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Build and audit every named declaration
        run: python3 scripts/verify.py
      - name: Check theorem correspondence and generated audit
        run: |
          python3 scripts/check_correspondence.py
          git diff --exit-code -- AxiomAudit.lean lake-manifest.json
          sha256sum -c SHA256SUMS
      - name: Upload build and axiom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-normalizer-verification
          path: lean/normalizer-core/receipts/
          if-no-files-found: warn
